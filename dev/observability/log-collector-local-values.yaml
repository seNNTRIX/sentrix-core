# Apply after sentrix-collection/deploy/otel-collector/daemonset-values.yaml.
image:
  tag: 0.160.0
config:
  receivers:
    filelog:
      # Only the local demo namespace; never read another project's logs.
      include: [/var/log/pods/sentrix_*/*/*.log]
      exclude:
        - /var/log/pods/sentrix_loki*/*/*.log
        - /var/log/pods/sentrix_otel-*/*/*.log
        - /var/log/pods/sentrix_prometheus-*/*/*.log
  service:
    pipelines:
      logs:
        exporters: [otlphttp/loki]
# Allow collector initialization on the single-node Mac before liveness can restart it.
startupProbe:
  httpGet: {path: /, port: 13133}
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 24
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 4
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
