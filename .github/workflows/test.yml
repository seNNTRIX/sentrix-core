name: Backend tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sentrix_test
          MYSQL_USER: sentrix_test
          MYSQL_PASSWORD: sentrix-test-local
          MYSQL_ROOT_PASSWORD: ci-root-local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package with MySQL 8.4
        run: >-
          ./mvnw -B verify
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/sentrix_test
          -Dspring.datasource.username=sentrix_test
          -Dspring.datasource.password=sentrix-test-local
      - name: Verify PromQL calculations with Prometheus
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/target:/tests:ro" prom/prometheus:v3.5.0
          test rules /tests/prometheus-query-tests.yaml /tests/collection-query-tests.yaml
