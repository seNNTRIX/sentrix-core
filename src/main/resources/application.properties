spring.application.name=sentrix-core
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/sentrix}
spring.datasource.username=${DB_USERNAME:sentrix}
spring.datasource.password=${DB_PASSWORD:sentrix-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Only an operator may expand this exact base-URL allowlist; empty disables outbound probes.
sentrix.data-sources.allowed-base-urls=${SENTRIX_DATASOURCE_ALLOWED_URLS:}

# Document only the implemented application APIs and the existing health endpoint.
springdoc.show-actuator=true
springdoc.paths-to-match=/api/v1/**,/actuator/health
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
